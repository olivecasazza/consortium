[package]
name = "consortium-slurm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Slurm job orchestration with nix-built environments for consortium"

[dependencies]
consortium.workspace = true
consortium-integration.workspace = true
thiserror.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[dev-dependencies]
consortium-fanout-sim.workspace = true
consortium-integration-testkit.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
