name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'doc/**'
      - 'README.md'
      - '.gitignore'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # ── Layer 1: Unit Tests (fast, GitHub-hosted) ─────────────────────
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run unit tests
        run: |
          # The ci profile writes target/nextest/ci/junit.xml itself. The old
          # `| tee` into that path failed (directory not yet created) and,
          # under pipefail, failed the step even when every test passed.
          cargo nextest run --workspace \
            --profile ci \
            --no-fail-fast

      - name: Publish test results
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: target/nextest/ci/junit.xml
          check_name: Unit Test Results
          include_passed: true

      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings
        continue-on-error: true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check CLI grammar
        run: cargo run -p consortium-cli --bin consortium-grammar -- check

      - name: Check docs build
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps

  # ── Layer 1b: Start-here walkthroughs against real sshd ──────────
  # Runs the commands shown in doc/ssh.md and doc/cast.md against the
  # runner's own sshd on three loopback addresses.
  walkthroughs:
    name: SSH and cast walkthroughs
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-walkthrough-${{ hashFiles('**/Cargo.lock') }}

      - name: Build CLI and fanout_ssh example
        run: |
          cargo build -p consortium-cli --bins
          cargo build -p consortium-examples --example fanout_ssh

      - name: Start sshd with key auth for the runner user
        run: |
          sudo apt-get install -y --no-install-recommends openssh-server
          sudo mkdir -p /run/sshd
          ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519 -N "" -q
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 700 ~/.ssh && chmod 600 ~/.ssh/authorized_keys
          sudo systemctl start ssh || sudo service ssh start
          for host in 127.0.0.1 127.0.0.2 127.0.0.3; do
            ssh-keyscan -H "$host" >> ~/.ssh/known_hosts 2>/dev/null
            ssh -o BatchMode=yes "$host" true
          done

      - name: SSH walkthrough (doc/ssh.md)
        env:
          NODES: 127.0.0.[1-3]
        run: PATH="$PWD/target/debug:$PWD/target/debug/examples:$PATH" examples/ssh/walkthrough.sh

      - name: cast walkthrough (doc/cast.md)
        env:
          NODES: 127.0.0.[1-3]
        run: PATH="$PWD/target/debug:$PATH" examples/nix/walkthrough.sh

      - name: Integration pipelines (doc/library.md)
        run: |
          for example in integration_nix_deploy integration_slurm integration_ansible integration_ray integration_skypilot; do
            cargo run -q -p consortium-examples --example "$example"
          done

  # ── Layer 2: Docker Integration Tests (GitHub-hosted) ─────────────
  docker-integration:
    name: Docker Integration Tests
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Docker assets and integration test crates moved to the
      # consortium-tests repo — fetch it into a subdirectory and
      # satisfy its ../consortium path deps with a self-symlink.
      - name: Check out consortium-tests
        uses: actions/checkout@v4
        with:
          repository: olivecasazza/consortium-tests
          ref: master
          path: consortium-tests

      - name: Create sibling layout for consortium-tests path deps
        run: ln -sfn . "$GITHUB_WORKSPACE/consortium"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            consortium-tests/target
          key: ${{ runner.os }}-cargo-docker-${{ hashFiles('**/Cargo.lock') }}

      - name: Generate SSH keys for test containers
        run: |
          mkdir -p consortium-tests/tests/docker/ssh
          ssh-keygen -t ed25519 -f consortium-tests/tests/docker/ssh/id_ed25519 -N "" -q
          cp consortium-tests/tests/docker/ssh/id_ed25519.pub consortium-tests/tests/docker/ssh/authorized_keys

      - name: Build SSH node image
        run: docker build -t consortium-ssh-node -f consortium-tests/tests/docker/Dockerfile.ssh-node consortium-tests/tests/docker/

      - name: Run Docker integration tests
        run: |
          cargo nextest run \
            --manifest-path consortium-tests/Cargo.toml \
            -p consortium-integration-tests \
            --features docker-tests \
            --test docker_integration \
            --profile ci \
            --test-threads=1 \
            --no-fail-fast

      - name: Publish test results
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: consortium-tests/target/nextest/ci/junit.xml
          check_name: Docker Integration Results
          include_passed: true

      - name: Cleanup containers
        if: always()
        run: |
          docker ps -a --filter "name=consortium-test" -q | xargs -r docker rm -f
          docker network ls --filter "name=consortium-test" -q | xargs -r docker network rm

  # ── Layer 2b: Tool Integration Tests (ARC runner, Docker + Nix) ──
  tool-integration:
    name: Tool Integration Tests
    needs: unit
    runs-on: nix-builder
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Ensure Nix is installed
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          force-no-systemd: true

      - name: Check out consortium-tests
        uses: actions/checkout@v4
        with:
          repository: olivecasazza/consortium-tests
          ref: master
          path: consortium-tests

      - name: Create sibling layout for consortium-tests path deps
        run: ln -sfn . "$GITHUB_WORKSPACE/consortium"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Setup Rust toolchain
        run: |
          # ARC runner images may not include Rust, so install it when absent.
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain stable
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup default stable 2>/dev/null || true
          cargo --version
          cargo nextest --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            consortium-tests/target
          key: ${{ runner.os }}-cargo-tool-${{ hashFiles('**/Cargo.lock') }}

      - name: Generate SSH keys for test containers
        run: |
          mkdir -p consortium-tests/tests/docker/ssh
          if [ ! -f consortium-tests/tests/docker/ssh/id_ed25519 ]; then
            ssh-keygen -t ed25519 -f consortium-tests/tests/docker/ssh/id_ed25519 -N "" -q
            cp consortium-tests/tests/docker/ssh/id_ed25519.pub consortium-tests/tests/docker/ssh/authorized_keys
          fi

      - name: Build specialized Docker images
        run: |
          docker build -t consortium-ssh-node -f consortium-tests/tests/docker/Dockerfile.ssh-node consortium-tests/tests/docker/
          docker build -t consortium-nix-node -f consortium-tests/tests/docker/Dockerfile.nix-node consortium-tests/tests/docker/
          docker build -t consortium-ansible-node -f consortium-tests/tests/docker/Dockerfile.ansible-node consortium-tests/tests/docker/

      - name: Run tool integration tests
        run: |
          # Use Nix to supply the host C linker independently of the runner image.
          nix shell nixpkgs#stdenv.cc -c \
            cargo nextest run \
            --manifest-path consortium-tests/Cargo.toml \
            -p consortium-integration-tests \
            --features docker-tests \
            --test tool_integration \
            --profile ci \
            --test-threads=1 \
            --no-fail-fast

      - name: Publish test results
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: consortium-tests/target/nextest/ci/junit.xml
          check_name: Tool Integration Results
          include_passed: true

      - name: Generate summary
        if: always()
        run: |
          RUNNER_HOST=$(cat /etc/hostname 2>/dev/null || hostname 2>/dev/null || echo "$RUNNER_NAME")
          echo "## Tool Integration Tests" >> $GITHUB_STEP_SUMMARY
          echo "**Runner:** \`${RUNNER_HOST}\` (self-hosted ARC)" >> $GITHUB_STEP_SUMMARY

      - name: Cleanup containers
        if: always()
        run: |
          docker ps -a --filter "name=nix-int\|ansible-int" -q | xargs -r docker rm -f

  # ── Layer 3: SemVer compatibility (GitHub-hosted) ────────────────
  # Buildbot builds every root `checks` attribute (source policy, fleet
  # contract, enrollment, cargo test/clippy/fmt, library, CLI, CLI smoke).
  # SemVer needs network access to Git and crates.io baselines, which a Nix
  # sandbox cannot provide, so it stays here.
  semver-gate:
    name: SemVer Compatibility
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # cargo-semver-checks 0.47.0 parses rustdoc formats up to the one
      # rustc 1.94 emits; rust-toolchain.toml floats on stable.
      - name: Install SemVer Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1

      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-semver-checks@0.47.0
          checksum: true

      - name: Check published crate APIs
        env:
          BASELINE_REV: ${{ github.event.pull_request.base.sha || github.event.before }}
          RUSTUP_TOOLCHAIN: 1.94.1
        run: ./scripts/semver-check.sh "${BASELINE_REV:-HEAD^}"
