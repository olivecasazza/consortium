name: Docs

on:
  push:
    branches: [master]
  workflow_dispatch:
  # Note: release docs are deployed by the release workflow directly
  # (GITHUB_TOKEN events don't trigger other workflows)

permissions:
  contents: write

jobs:
  docs:
    name: Build & Deploy Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build workspace docs
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: |
          cargo doc --workspace --no-deps
          echo '<meta http-equiv="refresh" content="0; url=consortium/index.html">' \
            > target/doc/index.html

      # One gh-pages push per run: back-to-back pushes from separate deploy
      # steps are rejected by GitHub with Internal Server Error.
      - name: Stage site
        run: |
          mkdir -p site
          cp -r target/doc site/latest
          echo '<meta http-equiv="refresh" content="0; url=latest/consortium/index.html">' \
            > site/index.html

      - name: Deploy docs
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          destination_dir: .
          keep_files: true

      - name: Generate summary
        run: |
          echo "## Documentation Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| URL | https://olivecasazza.github.io/consortium/latest/consortium/ |" >> $GITHUB_STEP_SUMMARY
          echo "| Crates | $(ls -d target/doc/consortium* 2>/dev/null | wc -l) |" >> $GITHUB_STEP_SUMMARY
