[workspace]
resolver = "2"
members = [
    "crates/consortium",
    "crates/consortium-cli",
    "crates/consortium-nix",
    "crates/consortium-ansible",
    "crates/consortium-slurm",
    "crates/consortium-ray",
    "crates/consortium-skypilot",
    "crates/consortium-fanout-sim",
    "crates/consortium-integration",
    "crates/consortium-integration-testkit",
    "examples",
]

[workspace.metadata.crane]
name = "consortium"

[workspace.package]
version = "0.3.2"
edition = "2021"
license = "LGPL-2.1-or-later"
repository = "https://github.com/olivecasazza/consortium"
description = "Rust cluster administration and infrastructure orchestration"

[workspace.dependencies]
consortium = { path = "crates/consortium", package = "consortium-crate", version = "0.3.2" }
consortium-nix = { path = "crates/consortium-nix", version = "0.3.2" }
consortium-ansible = { path = "crates/consortium-ansible", version = "0.3.2" }
consortium-slurm = { path = "crates/consortium-slurm", version = "0.3.2" }
consortium-ray = { path = "crates/consortium-ray", version = "0.3.2" }
consortium-skypilot = { path = "crates/consortium-skypilot", version = "0.3.2" }
consortium-fanout-sim = { path = "crates/consortium-fanout-sim", version = "0.3.2" }
consortium-integration = { path = "crates/consortium-integration", version = "0.3.2" }
consortium-integration-testkit = { path = "crates/consortium-integration-testkit", version = "0.3.2" }
thiserror = "2"
